name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Doctor smoke test on demo buildfile
        run: |
          qx doctor examples/demo.build || true
          qx explain "undefined reference to \`__errno_location'" | head -5
